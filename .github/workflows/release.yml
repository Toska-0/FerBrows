name: Publish FerBrows Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "1.1.7"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed Android release
    runs-on: ubuntu-latest
    env:
      FERBROWS_VERSION_CODE: ${{ github.run_number }}
      FERBROWS_VERSION_NAME: ${{ inputs.version || '1.1.7' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.FERBROWS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FERBROWS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FERBROWS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FERBROWS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing FERBROWS_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing FERBROWS_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing FERBROWS_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing FERBROWS_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ferbrows-release.jks"
          test -s "$RUNNER_TEMP/ferbrows-release.jks"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build signed Release APK
        env:
          FERBROWS_KEYSTORE_PATH: ${{ runner.temp }}/ferbrows-release.jks
          FERBROWS_KEYSTORE_PASSWORD: ${{ secrets.FERBROWS_KEYSTORE_PASSWORD }}
          FERBROWS_KEY_ALIAS: ${{ secrets.FERBROWS_KEY_ALIAS }}
          FERBROWS_KEY_PASSWORD: ${{ secrets.FERBROWS_KEY_PASSWORD }}
        run: |
          VERSION_NAME="${FERBROWS_VERSION_NAME#v}"
          gradle --no-daemon assembleRelease -PversionCode="$FERBROWS_VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Prepare universal APK
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p release-assets
          cp "$APK" release-assets/apk-release-universal.apk

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs release-assets/apk-release-universal.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FerBrows-${{ inputs.version || '1.1.7' }}-universal
          path: release-assets/apk-release-universal.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version || '1.1.7' }}
          target_commitish: main
          name: ${{ inputs.version || '1.1.7' }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## Новое в 1.1.7

            ### Блокировщик рекламы и защита от трекеров
            - Добавлена загрузка списков EasyList, EasyPrivacy и AdGuard Mobile.
            - Фильтры сохраняются локально и обновляются автоматически раз в 24 часа.
            - Реализована поддержка распространённых сетевых правил ABP: шаблоны URL, исключения, типы ресурсов, ограничения по доменам и сторонние запросы.
            - Добавлена поддержка косметических правил для скрытия рекламных элементов на страницах.
            - Добавлена ранняя инъекция CSS для скрытия известных рекламных баннеров до полной загрузки страницы.
            - Усилена блокировка рекламных изображений и iframe по характерным адресам баннеров.
            - Расширена защита от трекеров Sentry, Bugsnag и Яндекс Метрики.
            - Оптимизирован поиск правил по доменам и загрузка фильтров в фоновом потоке.
            - Исправлена стабильность блокировщика: ограничено число сохраняемых сетевых и косметических правил, чтобы снизить расход памяти и риск аварийного закрытия браузера.

            ### Обновление браузера
            - В окне обновления теперь отображается список изменений из описания релиза.

            ### Примечание
            - Набор поддерживаемых правил — практическая часть синтаксиса ABP, а не полная реализация uBlock Origin.
            - Результат теста checkadblock.ru необходимо подтвердить после установки APK на устройстве.

          files: release-assets/apk-release-universal.apk
