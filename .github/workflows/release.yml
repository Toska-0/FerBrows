name: Publish FerBrows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed Android release
    runs-on: ubuntu-latest
    env:
      FERBROWS_VERSION_CODE: ${{ github.run_number }}
      FERBROWS_VERSION_NAME: ${{ inputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.FERBROWS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FERBROWS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FERBROWS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FERBROWS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing FERBROWS_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing FERBROWS_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing FERBROWS_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing FERBROWS_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ferbrows-release.jks"
          test -s "$RUNNER_TEMP/ferbrows-release.jks"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build signed Release APK
        env:
          FERBROWS_KEYSTORE_PATH: ${{ runner.temp }}/ferbrows-release.jks
          FERBROWS_KEYSTORE_PASSWORD: ${{ secrets.FERBROWS_KEYSTORE_PASSWORD }}
          FERBROWS_KEY_ALIAS: ${{ secrets.FERBROWS_KEY_ALIAS }}
          FERBROWS_KEY_PASSWORD: ${{ secrets.FERBROWS_KEY_PASSWORD }}
        run: |
          VERSION_NAME="${FERBROWS_VERSION_NAME#v}"
          gradle --no-daemon assembleRelease -PversionCode="$FERBROWS_VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Prepare universal APK
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p release-assets
          cp "$APK" release-assets/apk-release-universal.apk

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs release-assets/apk-release-universal.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FerBrows-1.0.0-universal
          path: release-assets/apk-release-universal.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: main
          name: FerBrows ${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            # FerBrows ${{ inputs.version }} — первый стабильный релиз

            Лёгкий Android-браузер от Toska Game Studio с акцентом на удобство, контроль над данными и персонализацию.

            ## Основные возможности

            - **Удобный просмотр сайтов:** вкладки, обзор открытых страниц, группы вкладок, жесты назад/вперёд и восстановление обычных вкладок.
            - **Персонализация:** светлая, тёмная и системная темы, цветовые акценты, компактный интерфейс и настройки анимаций.
            - **Закладки и история:** создание и редактирование закладок, импорт и экспорт, поиск и очистка истории.
            - **Менеджер паролей:** ручное создание защищённых записей. Данные шифруются AES-GCM, ключ хранится в Android Keystore.
            - **Ручное автозаполнение:** только при точном совпадении сайта с адресом записи. Автоматического перехвата форм и сохранения паролей нет.
            - **Загрузки:** просмотр прогресса, открытие файлов и управление загрузками.
            - **Инструменты:** снимки страниц, перевод через Google Translate, очистка данных сайтов и проверка обновлений.
            - **Защита:** Safe Browsing при поддержке WebView и дополнительный список известных рекламных и аналитических доменов.

            ## Приватность и ограничения

            - История, закладки, настройки и обычные вкладки хранятся локально.
            - Аккаунт FerBrows и облачная синхронизация не требуются.
            - FerBrows не является VPN и не обеспечивает полную анонимность.
            - Для отображения сайтов используется системный Android System WebView.
            - Некоторые функции зависят от версии Android System WebView.

            ## Установка и обновление

            1. Скачайте **apk-release-universal.apk** из Assets.
            2. Откройте APK и подтвердите установку Android.
            3. Для обновления установите APK поверх предыдущей версии. Не удаляйте приложение, иначе локальные данные будут потеряны.

            Минимальная версия: **Android 7.0 (API 24)**.

            APK подписан релизным ключом проекта.
          files: release-assets/apk-release-universal.apk
