name: Android APK

on:
  push:
    branches: [ main, ferbrows/productization ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Android APKs
    runs-on: ubuntu-latest
    env:
      FERBROWS_HAS_RELEASE_KEY: ${{ secrets.FERBROWS_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Decode release keystore
        if: env.FERBROWS_HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.FERBROWS_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ferbrows-release.jks"
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build APKs
        env:
          FERBROWS_KEYSTORE_PATH: ${{ secrets.FERBROWS_KEYSTORE_BASE64 != '' && format('{0}/ferbrows-release.jks', runner.temp) || '' }}
          FERBROWS_KEYSTORE_PASSWORD: ${{ secrets.FERBROWS_KEYSTORE_PASSWORD }}
          FERBROWS_KEY_ALIAS: ${{ secrets.FERBROWS_KEY_ALIAS }}
          FERBROWS_KEY_PASSWORD: ${{ secrets.FERBROWS_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FerBrows-android-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run Android UI smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest
