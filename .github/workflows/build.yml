name: Android APK

on:
  push:
    branches: [ main, ferbrows/productization ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build Android APKs
    runs-on: ubuntu-latest
    env:
      FERBROWS_HAS_RELEASE_KEY: ${{ secrets.FERBROWS_KEYSTORE_BASE64 != '' }}
      FERBROWS_VERSION_CODE: ${{ github.run_number }}
      # PR builds for the current maintenance line must carry the actual release version,
      # not the old Gradle fallback (1.0.0). Tagged builds use their tag as before.
      FERBROWS_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '1.1.7' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Decode release keystore
        if: env.FERBROWS_HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.FERBROWS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ferbrows-release.jks"
          test -s "$RUNNER_TEMP/ferbrows-release.jks"
      - name: Validate release signing secrets
        if: env.FERBROWS_HAS_RELEASE_KEY == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.FERBROWS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FERBROWS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FERBROWS_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || (echo "Missing FERBROWS_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing FERBROWS_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing FERBROWS_KEY_PASSWORD" && exit 1)
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build APKs
        env:
          FERBROWS_KEYSTORE_PATH: ${{ secrets.FERBROWS_KEYSTORE_BASE64 != '' && format('{0}/ferbrows-release.jks', runner.temp) || '' }}
          FERBROWS_KEYSTORE_PASSWORD: ${{ secrets.FERBROWS_KEYSTORE_PASSWORD }}
          FERBROWS_KEY_ALIAS: ${{ secrets.FERBROWS_KEY_ALIAS }}
          FERBROWS_KEY_PASSWORD: ${{ secrets.FERBROWS_KEY_PASSWORD }}
        run: |
          VERSION_NAME="${FERBROWS_VERSION_NAME#v}"
          if [ "$FERBROWS_HAS_RELEASE_KEY" = "true" ]; then
            gradle --no-daemon assembleDebug assembleRelease -PversionCode="$FERBROWS_VERSION_CODE" -PversionName="$VERSION_NAME"
          else
            echo "::warning::Release signing key is not configured. Building a test-only Debug APK; no updateable Release APK will be published."
            gradle --no-daemon assembleDebug -PversionCode="$FERBROWS_VERSION_CODE" -PversionName="$VERSION_NAME"
          fi
      - name: Upload Debug APK (test channel)
        uses: actions/upload-artifact@v4
        with:
          name: FerBrows-debug-test-only
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare universal Release APK
        if: env.FERBROWS_HAS_RELEASE_KEY == 'true'
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p release-assets
          cp "$APK" release-assets/apk-release-universal.apk
      - name: Verify signed Release APK
        if: env.FERBROWS_HAS_RELEASE_KEY == 'true'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs release-assets/apk-release-universal.apk
      - name: Upload signed Release APK
        if: env.FERBROWS_HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FerBrows-release-update
          path: release-assets/apk-release-universal.apk
          if-no-files-found: error
          retention-days: 90
